/home/rldc/RLdC_AiNalyzator/RLdC_AiNalyzator/logs/runtime/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    size 50M
    create 0640 rldc rldc
    sharedscripts
    postrotate
        touch /home/rldc/RLdC_AiNalyzator/RLdC_AiNalyzator/logs/runtime/.rotated 2>/dev/null || true
    endscript
}

/home/rldc/RLdC_AiNalyzator/RLdC_AiNalyzator/logs/dev/*.log {
    daily
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    size 20M
    create 0640 rldc rldc
    copytruncate
}
